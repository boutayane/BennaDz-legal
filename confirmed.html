<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Compte confirmé — BennaDz</title>
<style>
  :root { --terra:#C6522E; --ink:#2A211C; --muted:#7A6E66; --bg:#FBF7F4; --card:#fff; --border:#EADFD8; --ok:#2E7D46; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; background:var(--bg); color:var(--ink); line-height:1.6; }
  .wrap { max-width:460px; margin:0 auto; padding:40px 20px; }
  .logo { width:72px; height:72px; border-radius:20px; background:var(--terra); display:flex; align-items:center; justify-content:center; margin:0 auto 16px; color:#fff; font-size:34px; }
  h1 { font-size:22px; text-align:center; margin:0 0 4px; }
  p.sub { color:var(--muted); text-align:center; margin:0 0 24px; font-size:15px; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:16px; padding:24px; text-align:center; }
  .check { width:64px; height:64px; border-radius:50%; background:#E7F4EC; color:var(--ok); display:flex; align-items:center; justify-content:center; font-size:34px; margin:0 auto 14px; }
  .title { font-size:18px; font-weight:800; margin:0 0 6px; }
  .text { color:var(--muted); font-size:15px; margin:0; }
  a.btn { display:block; margin-top:22px; padding:14px; border-radius:12px; background:var(--terra); color:#fff; font-size:16px; font-weight:700; text-decoration:none; }
  .hint { color:var(--muted); font-size:13px; margin-top:14px; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="logo">🍴</div>
    <h1>BennaDz</h1>
    <p class="sub">Espace vendeur</p>

    <div class="card">
      <div class="check">✓</div>
      <p class="title">Votre adresse e-mail est confirmée</p>
      <p class="text">Votre compte vendeur est activé. Ouvrez l'application BennaDz et connectez-vous pour commencer à recevoir des commandes.</p>
      <a class="btn" href="bennadz://">Ouvrir BennaDz</a>
      <p class="hint">Si le bouton ne fait rien, ouvrez simplement l'application BennaDz depuis votre téléphone.</p>
    </div>
  </div>
</body>
</html>
